changelog = "Reactivated as one native .hmod on Horizon's mod API: the code and all the content in one package (remove the separate assets mod if you have it). Quarries hold their chunks under the mod's own ticket controller, saved by the game; a chunk-upgraded quarry in the Nether or the End works after the world reopens with nobody there. Pinned to Nightly 2026-11-21 (8f83e5c) and Horizon Mixins e59da90."
