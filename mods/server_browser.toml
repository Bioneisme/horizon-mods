id = "server_browser"
kind = "native-mod"
name = "Server Atlas"
summary = "Discover and organize Minecraft servers with filters, favorites and local notes."
description = """
Server Atlas is an independent, MIT-licensed native Rust multiplayer browser for Horizon and Minecraft Java 26.3, with familiar Minecraft buttons and translucent server rows.

Features: My Servers, Discover, Favorites, Recent and LAN tabs; search names, addresses, MOTDs, tags and notes; combined status, version, ping and player-count filters; local notes and groups; custom ordering; saved filter profiles; JSON/NBT import/export preserving unknown vanilla fields. English and German are included.

Public discovery combines Modrinth and minecraftserve.rs with a bundled catalog of 2,835 public addresses. It is enabled by default and can be switched off. Personal server lists, notes and search text are not submitted to directory providers. Normal status pings contact the servers being checked. Feedback and server suggestions save local drafts; automatic email delivery is not configured. Joining and authentication use Horizon's existing implementation.

Install the .hnmod in the desired Horizon instance, enable it, build through the official launcher and open Multiplayer in that built instance. Native code runs with the player's permissions. No separate host patch or companion executable is required.

Version 2.2.0 was built and tested on Nightly 2026-11-04: Horizon 6475f62f3c834b7489e1816bf47f47ea5eb2b879 and horizon-mixins a2af5c0dd4117d51ecd70066ba7a00b4a2c10dab. The official package checker, native build, 44 Rust tests and isolated game checks pass. Runtime coverage includes 10,000 saved entries, CRUD/filter/undo, Mods on/off, controller keyboard, GUI scales/4K, both live directories and real local-server Join/Direct Connect. Future Nightlies and combined native mod sets need separate validation. This bundle is unsigned.

Real game captures and installation: https://musti3214.github.io/Horizon-Server-Browser/
Validation: https://github.com/Musti3214/Horizon-Server-Browser/blob/v2.2.0/mod/VALIDATION.md

Developed with Codex assistance at the owner's request. Separate Fabric and Forge public betas are different files from this native Horizon bundle."""
authors = ["shuab"]
owners = ["Musti3214"]
license = "MIT"
source = "https://github.com/Musti3214/Horizon-Server-Browser/tree/v2.2.0/mod"
icon = "https://raw.githubusercontent.com/Musti3214/Horizon-Server-Browser/v2.2.0/docs/horizon-registry/icons/server_browser.png"

