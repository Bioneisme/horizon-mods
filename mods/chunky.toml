name = "Chunky For Horizon"
summary = "Pre-generates chunks quickly, safely, and efficiently for Horizon worlds"
description = """
A fast, safe, and efficient chunk pre-generation mod for [Horizon](https://playhorizon.dev), the native Rust reimplementation of Minecraft: Java Edition.

**Chunky for Horizon** is a 100% feature-complete native port of [Chunky](https://github.com/pop4959/Chunky) by pop4959, implemented in Rust around Horizon's native mod hooks with zero external dependencies.

---

### Features

- **Full Command Parity**: Complete `/chunky` command tree with 24 Brigadier subcommands and client-side tab completion.
  - `start [world] [shape] [cx cz] [rx [rz]]`
  - `pause [world]`, `continue [world]`, `cancel [world]`
  - `progress`, `quiet <seconds>`, `silent`, `limit <rate>`
  - `center [x z]`, `radius <rx> [rz]`, `corners <x1 z1 x2 z2>`
  - `shape <shape>`, `pattern <pattern>`, `world [name]`
  - `spawn`, `worldborder`, `selection`
  - `trim [world] [shape] [cx cz] [rx [rz]] <inside|outside> [filters...]`
  - `confirm`, `reload`, `help [page]`
- **Generation Shapes**: Square, Circle, Rectangle, Ellipse, Diamond, Pentagon, Hexagon, Triangle, and Star.
- **Walk Patterns**: Concentric rings, Loop, Spiral, Strip bands, and custom CSV coordinate lists.
- **Dedicated Server Console**: Full headless execution support directly from the server CLI terminal without needing an in-game player.
- **Chunk Trimming**: Safe, high-speed Anvil region file inspection and trimming with `inhabited` and `unmodified` filter support.
- **Task Persistence & Recovery**: Automatic task saving into `<world>/tasks/<world>.properties`, supporting `continue_on_restart` and safe pausing/cancelling.
- **GUI Integration**: Configure update intervals, player limits, silence mode, and auto-continue directly via **Options → Mods → Chunky**.

---

### Getting Started

1. Set your generation center (defaults to current position or world spawn):

```text
/chunky center 0 0
```

2. Set your generation radius in blocks:

```text
/chunky radius 1000
```

3. *(Optional)* Pick a shape and pattern:

```text
/chunky shape circle
/chunky pattern concentric
```

4. Start pre-generating:

```text
/chunky start
```

You can pause with `/chunky pause`, monitor progress with `/chunky progress`, or cancel with `/chunky cancel`.

---

### Requirements

- Requires **Horizon 26.3 Nightly** (revision `6560641`) or newer.
- Compatible with singleplayer, LAN hosts, and headless dedicated servers.

*Unofficial port. Chunky is originally developed by pop4959 under the GNU General Public License v3.0.*"""
