changelog = """
### Added

- **Dedicated Server Console Execution**: Full command execution support directly from the headless dedicated server CLI terminal (`native_perform_console_command`), allowing server administrators to configure and run pre-generation tasks without needing an in-game player.
- **Command Prefix Flexibility**: Resilient command handling supporting both `/chunky` and `chunky` (without leading slash) from both the terminal and in-game chat.
- **Daily-Use Integration Test Suite**: 88 unit and integration tests covering generation ring transitions, pause/resume parity, world reload lifecycles, and mid-generation adjustments.

### Fixed

- **Completed Task Slot Freeing**: Finished pre-generation tasks are now cleanly removed from active memory and temporary task records are cleared, allowing immediate subsequent `/chunky start` commands with new radii or shapes without confirmation deadlocks.
- **Immediate Pause Response**: `/chunky pause` immediately halts generation on the spot, releases held chunk tickets, saves task state cleanly, and silences progress notifications.
- **Ring Pattern Boundary Stall**: Fixed a boundary issue at chunk 3,970 where concentric ring traversal prematurely marked the iterator as exhausted when stepping between rings.
- **Cached Chunks Deadlock**: Resolved a stall where requesting chunks already present in game memory failed to trigger new load events."""
