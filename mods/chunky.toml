changelog = """
Fixed commands like `/chunky` not working in single-player and LAN.

The client was intercepting commands before they could reach the server. `command.rs` now skips client-side claiming when `game.remote.is_some()`, so Horizon forwards them as chat packets to the authoritative server thread. There, `native_perform_command` handles the command and `native_server_tick` drives chunk generation.

Also added tests covering everyday command usage, checking that routing behaves the same in integrated single-player, LAN chat, and the console."""
