name = "Chunky For Horizon"
summary = "Pre-generates chunks, quickly, efficiently, and safely in horizon"
description = """
# Chunky for Horizon

**Chunky for Horizon** is a native port of [Chunky](https://github.com/pop4959/Chunky), the popular chunk pre-generation tool, rebuilt for Horizon (Minecraft 26.3 in Rust). It generates your world's chunks ahead of time, so exploring doesn't cause terrain generation lag or stutter.

## Features

- **Full command parity:** the complete `/chunky` command tree, with tab completion for players and the dedicated server console.
- **9 shapes:** `square`, `circle`, `rectangle`, `ellipse`, `diamond`, `pentagon`, `hexagon`, `triangle` and `star`.
- **7 traversal patterns:** `concentric`, `loop`, `spiral`, `strip`, `csv`, `ring` and `world` (existing chunks).
- **Region trimming:** `/chunky trim` removes unused or unmodified chunks to save disk space.
- **Persistent tasks:** tasks are saved to `<world>/tasks/<world>.properties`, so you can pause, continue or resume them even after reloading the world.
- **Adjustable pacing:** control the speed with `/chunky limit <rate>` and how often you get updates with `/chunky quiet <seconds>`.

## Quick start

1. **Set the center**
   - At your position or spawn: `/chunky spawn`
   - At specific coordinates: `/chunky center 0 0`
   - To match the world border: `/chunky worldborder`
2. **Set the radius** (in blocks):
   ```
   /chunky radius 1000
   ```
3. **Pick a shape** (optional, the default is `square`):
   ```
   /chunky shape circle
   ```
4. **Start pre-generating:**
   ```
   /chunky start
   ```
5. **Manage the task while it runs:**
   - Check status: `/chunky progress`
   - Pause: `/chunky pause`
   - Continue: `/chunky continue`
   - Cancel: `/chunky cancel`

## Requirements

- Horizon 26.3 
- Works in single-player, LAN worlds and dedicated headless servers.
- No external libraries or dependencies needed."""
