id = "clh_rust"
kind = "native-mod"
name = "Сhunk Limiter HUD"
summary = "Displays configurable limits for blocks and entities in the player's current chunk."
description = """
Chunk Limiter HUD
Chunk Limiter HUD is a client-side Fabric mod that counts configured blocks and entities in the player's current chunk.

Features
- Configurable limits for blocks and entities
- Custom groups with shared limits
- Dark HUD with block and spawn egg icons
- Remaining capacity display
- Red highlighting for overloaded blocks and entities
- In-game configuration menu
- Mod Menu integration
- No server-side installation required

Controls
L — open the configuration menu
O — toggle the HUD"""
