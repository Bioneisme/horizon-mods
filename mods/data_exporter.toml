id = "data_exporter"
kind = "native-mod"
name = "Data Exporter"
summary = "Saves what happens in your game and your statistics to files on your computer, ready to analyze."
description = """
Turns what happens in your game into data you own. While you play, Data Exporter saves events and statistics to files on your computer, ready to analyze with DuckDB, pandas, Spark or a spreadsheet.

Nothing is sent over the network. It only writes to the folder you choose.

- What it saves:
    - Session and player: joining and leaving, dimension changes, and a sample of position, health and food every 5 seconds.

    - Blocks and combat: blocks broken and placed with their coordinates, your deaths, and the mobs you kill.

    - Items and progress: crafting, items picked up, and advancements.

    - Statistics: every increase of the game's statistics, at the moment it happens.

By default it only saves your own data. Other players' data, typed text and keyboard input are not captured.

- How to use it

Go to Options > Mods > Data Exporter > Settings. One button per group turns it on or off, and another switches between JSONL and CSV. Open profile location shows the settings file, and Copy profile path copies its path.

Files go to data-exporter/ in your game folder, one file per kind of data, world and session.

- Your profile

Everything is in config/data_exporter.json. Edit it while playing and the mod picks it up within a second. There you can turn each kind of data on or off, send one to its own folder or format, and set size limits. When the folder reaches its limit, the mod stops saving. It never deletes your data.

Tested on macOS. Source and full documentation: https://github.com/DylanGonzaloFerreyra/horizon-data-exporter"""
authors = ["Dylan Gonzalo Ferreyra"]
owners = ["DylanGonzaloFerreyra"]
