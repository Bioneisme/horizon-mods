name = "Durability Tooltip"
summary = "Displays item durability values, percentages, and color indicators directly in tooltips."
description = """
# Durability Tooltip

A lightweight native Rust mod for Horizon Minecraft that displays accurate durability information directly inside item tooltips.

See exactly how much durability your equipment has left without opening the debug screen or using additional overlays.

## Features

- **Precise Durability:** Displays remaining and maximum durability, including the percentage.
- **Color Indicators:** Green for healthy equipment, yellow for moderately damaged items, and red for critically damaged items.
- **Wide Item Support:** Works with tools, weapons, armor, shields, elytra, and other damageable items.
- **Localization:** Uses Minecraft's built-in translations to support different languages.
- **Clean Tooltips:** Avoids duplicating standard advanced durability information.
- **In-Game Toggle:** Enable or disable the mod through Horizon's mod settings.
- **Lightweight:** Runs entirely on the client, without background polling.

## Example

Durability: 847 / 1561 (54%)

## Installation

1. Install Durability Tooltip through the Horizon Launcher.
2. Build your Horizon instance with the mod enabled.
3. Launch Minecraft.
4. Hover over any damageable item to see its remaining durability.

## Compatibility

- Minecraft Java Edition 26.3
- Horizon Native Mod API
- Client-side only

## Technical Information

Built independently in Rust using Horizon's native tooltip hooks.

The mod does not require server installation, modify item statistics, collect user data, or make network requests.

**Source code:** https://github.com/maliferen/horizon-durability-tooltip

**License:** MIT"""
