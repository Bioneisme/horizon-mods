description = '''
A native utility and PvP client for Horizon, featuring customizable modules, combat automation and a built-in ClickGUI.

Description

Sunset is a native Rust-based utility and PvP client for Horizon, designed for Minecraft 26.3.

It provides modules across six categories: Combat, Movement, Player, Render, World and Client. Features include combat automation, movement utilities, inventory management, HUD elements, world detection tools and extensive customization.

**Controls**

- Press Right Shift or \` to open the ClickGUI.
- Left-click a module to enable or disable it.
- Right-click a module to configure its settings and keybind.
- Use `.help` in chat to see available commands.

**Installation**

Install Sunset through the Horizon Mod Registry once approved, or follow the manual installation instructions in the source repository.

**License**

Sunset is licensed under PolyForm Strict 1.0.0, with additional permissions explicitly granted to Horizon for source review, testing and distribution of official, unmodified releases.

