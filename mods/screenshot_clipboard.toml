id = "screenshot_clipboard"
kind = "native-mod"
name = "Screenshot Clipboard"
summary = "Automatically copies Minecraft screenshots to your clipboard for instant pasting with Ctrl+V."
description = """
Screenshot Clipboard lets you instantly paste Minecraft screenshots into Discord, Telegram, or any image editor without opening the screenshots folder.

**Features:**
- Automatically copies screenshots taken with F2 to the clipboard.
- Keeps the original screenshots saved as usual.
- Shows a Minecraft-style notification when a screenshot is copied.
- Supports English and Russian notifications.
- Includes in-game toggles for copying and notifications.

**Compatibility:** Minecraft 26.3, Horizon Native, Windows only.

Built in Rust. No network access or telemetry."""
