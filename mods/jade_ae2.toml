id = "jade_ae2"
kind = "native-mod"
name = "Jade AE2 Plugin"
summary = "Unofficial port of AE2's Jade plugin: network state, channels, P2P links, charge and crafting in Jade."
description = """
An unofficial port of the Jade plugin inside Applied Energistics 2 15.4.12 to Horizon, not made or endorsed by its authors. Please report problems to this port, not to them.

Shows network state, smart cable channels, P2P links, charge, crafting and stored power in Jade, and names the facade or cable under the crosshair.

**Needs both** AE2 for Horizon and Jade for Horizon in the same build.

### Missing or not the same
No missing feature is known. Its lines cover what the AE2 port has, so they share that port's limits.

### Tested
Windows, in single player and on LAN with one guest. On a dedicated server its lines were checked on an earlier build, not this one. Other platforms were not tested."""
