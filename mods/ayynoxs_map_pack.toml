changelog = """
B opens a window for the waypoint's name (Enter saves, Esc cancels). Standing on a waypoint, you rename it.
Backspace removes the waypoint your crosshair aims at (or the one under the cursor on the world map). Rebindable.
Waypoints and maps belong to the server's own world: a server's lobby, farm world or own End no longer share them.
Detailed world map: biome colours for grass, leaves and water, the floor shining through shallow water, smooth relief shading, averaged cells when zoomed out.
Sharing: /wp share <nr> <player> sends a waypoint as a private message on any server. Explored chunks and new waypoints are shared live in Horizon co-op/LAN and on Horizon servers, and on Paper servers with AyynoxsMapSync-0.4.0.jar (put it in plugins).
Built for Horizon nightly 6475f62 (2026-11-04)."""
