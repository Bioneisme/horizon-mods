id = "ae2_jei"
kind = "native-mod"
name = "AE2 JEI Integration"
summary = """Unofficial port of AE2 JEI Integration: AE2's recipes in JEI, and "+" transfer into its terminals."""
description = """
An unofficial port of AE2 JEI Integration 1.2.1 and AE2's JEI plugin to Horizon, not made or endorsed by the original authors. Please report problems to this port, not to them.

Adds AE2's recipe categories and information pages to JEI, "+" transfer into AE2's terminals, and dragging items from JEI onto AE2's config slots. It also adds a centred recipe window, the panel on the creative screen, and a page for every item saying where it comes from.

**Needs both** AE2 for Horizon and a JEI bundle for Horizon in the same build. JEI is not included.

### Missing or not the same
No missing feature is known. It works only with these Horizon bundles, not with Java JEI addons. Ore shares are estimates from the world generator's data.

### Tested
Windows, in single player and on LAN with one guest. It works on the client: it was in the client that joined a dedicated server, but nothing specific to JEI was checked there. Other platforms were not tested."""
