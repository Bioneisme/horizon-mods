tags = ["cosmetic", "skin", "player-model", "first-person", "physics"]
screenshots = ["screenshots/kotost_body/1.png", "screenshots/kotost_body/2.png", "screenshots/kotost_body/3.png", "screenshots/kotost_body/4.png"]

